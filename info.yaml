# Tiny Tapeout project information
project:
  title:        "Programmable FIR Filter (bit-serial)"
  author:       "Will"
  discord:      ""
  description:  "N-tap signed FIR filter with loadable Q1.7 coefficients, time-multiplexed bit-serial MAC"
  language:     "Verilog"
  clock_hz:     50000000

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "1x1"

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_justwillhd_fir"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  source_files:
    - "project.v"
    - "fir_core.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
pinout:
  # Inputs
  ui[0]: "DIN[0] sample / coefficient"
  ui[1]: "DIN[1]"
  ui[2]: "DIN[2]"
  ui[3]: "DIN[3]"
  ui[4]: "DIN[4]"
  ui[5]: "DIN[5]"
  ui[6]: "DIN[6]"
  ui[7]: "DIN[7] (sign)"

  # Outputs
  uo[0]: "DOUT[0] filtered y[n]"
  uo[1]: "DOUT[1]"
  uo[2]: "DOUT[2]"
  uo[3]: "DOUT[3]"
  uo[4]: "DOUT[4]"
  uo[5]: "DOUT[5]"
  uo[6]: "DOUT[6]"
  uo[7]: "DOUT[7] (sign)"

  # Bidirectional pins
  uio[0]: "COEF_WR (in, rising edge loads a coefficient)"
  uio[1]: "IN_VALID (in, rising edge loads a sample)"
  uio[2]: "GAIN[0] (in)"
  uio[3]: "GAIN[1] (in)"
  uio[4]: ""
  uio[5]: ""
  uio[6]: "READY (out)"
  uio[7]: "OUT_VALID (out)"

# Do not change!
yaml_version: 6
